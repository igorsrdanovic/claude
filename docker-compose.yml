version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: markdown-notes:latest
    container_name: markdown-notes-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google/callback}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
    volumes:
      # Persist user data
      - vaults-data:/app/vaults
      - db-data:/app
    networks:
      - notes-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/auth/me', (r) => {process.exit(r.statusCode === 200 || r.statusCode === 401 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  vaults-data:
    driver: local
  db-data:
    driver: local

networks:
  notes-network:
    driver: bridge
