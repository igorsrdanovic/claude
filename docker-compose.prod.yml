version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: markdown-notes:production
    container_name: markdown-notes-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # IMPORTANT: Set these in .env.production file or environment
      - SESSION_SECRET=${SESSION_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - APP_URL=${APP_URL}
    volumes:
      # Persist user data
      - vaults-data:/app/vaults
      # Persist database
      - db-data:/app
      # Optional: Mount config (read-only)
      - ./config.json:/app/config.json:ro
    networks:
      - notes-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/auth/me', (r) => {process.exit(r.statusCode === 200 || r.statusCode === 401 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Add nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: markdown-notes-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # For SSL certificates (if using)
      # - ./ssl:/etc/nginx/ssl:ro
    networks:
      - notes-network
    depends_on:
      - app
    profiles:
      - with-nginx

volumes:
  vaults-data:
    driver: local
  db-data:
    driver: local

networks:
  notes-network:
    driver: bridge
